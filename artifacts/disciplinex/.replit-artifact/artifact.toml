kind = "web"
previewPath = "/"
title = "DisciplineX"
version = "1.0.0"
id = "artifacts/disciplinex"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21045

[services.development]
run = "pnpm --filter @workspace/disciplinex run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/disciplinex", "run", "build" ]
publicDir = "artifacts/disciplinex/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21045"
BASE_PATH = "/"
