openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DisciplineX API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tasks
    description: Task operations
  - name: stats
    description: User stats and discipline engine
  - name: activity
    description: Daily activity tracking
  - name: profiles
    description: User profile management
  - name: goals
    description: Goal tracking and progress
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks for current user
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
        - in: query
          name: date
          required: false
          schema:
            type: ["string", "null"]
        - in: query
          name: completed
          required: false
          schema:
            type: ["boolean", "null"]
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a new task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /tasks/{id}/complete:
    patch:
      operationId: completeTask
      tags: [tasks]
      summary: Toggle task completion
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCompleteInput"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /stats/{user_id}:
    get:
      operationId: getUserStats
      tags: [stats]
      summary: Get user discipline stats
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"
    put:
      operationId: upsertUserStats
      tags: [stats]
      summary: Upsert user stats
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatsInput"
      responses:
        "200":
          description: Updated stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserStats"

  /activity:
    get:
      operationId: fetchActivity
      tags: [activity]
      summary: Get daily activity for heatmap
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
        - in: query
          name: days
          required: false
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Activity records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyActivity"
    post:
      operationId: recordActivity
      tags: [activity]
      summary: Record activity for today
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "200":
          description: Activity recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyActivity"

  /profiles/{user_id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: Get user profile
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Not found
    put:
      operationId: upsertProfile
      tags: [profiles]
      summary: Create or update user profile
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /goals:
    get:
      operationId: listGoals
      tags: [goals]
      summary: List goals for a user
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a new goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalInput"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    patch:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalUpdate"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /stats/{user_id}/discipline:
    post:
      operationId: recalculateDiscipline
      tags: [stats]
      summary: Recalculate discipline score
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated discipline score
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisciplineResult"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Task:
      type: object
      required: [id, user_id, title, completed, created_at]
      properties:
        id:            { type: string }
        user_id:       { type: string }
        title:         { type: string }
        description:   { type: ["string", "null"] }
        completed:     { type: boolean }
        completed_at:  { type: ["string", "null"] }
        due_date:      { type: ["string", "null"] }
        priority:      { type: ["string", "null"] }
        created_at:    { type: string }
        updated_at:    { type: string }

    TaskInput:
      type: object
      required: [user_id, title]
      properties:
        user_id:       { type: string }
        title:         { type: string, minLength: 1 }
        description:   { type: string }
        due_date:      { type: string }
        priority:      { type: string, enum: [low, medium, high] }

    TaskUpdate:
      type: object
      properties:
        title:         { type: string, minLength: 1 }
        description:   { type: string }
        due_date:      { type: string }
        priority:      { type: string }

    TaskCompleteInput:
      type: object
      required: [completed]
      properties:
        completed: { type: boolean }

    UserStats:
      type: object
      required: [user_id, discipline_score, current_streak, longest_streak, total_tasks_completed, weekly_completion_pct, level, momentum_score]
      properties:
        user_id:                { type: string }
        discipline_score:       { type: number }
        weekly_change:          { type: number }
        current_streak:         { type: integer }
        longest_streak:         { type: integer }
        total_tasks_completed:  { type: integer }
        weekly_completion_pct:  { type: number }
        level:                  { type: string }
        momentum_score:         { type: number }
        last_active_date:       { type: ["string", "null"] }
        updated_at:             { type: string }

    UserStatsInput:
      type: object
      properties:
        discipline_score:       { type: number }
        weekly_change:          { type: number }
        current_streak:         { type: integer }
        longest_streak:         { type: integer }
        total_tasks_completed:  { type: integer }
        weekly_completion_pct:  { type: number }
        level:                  { type: string }
        momentum_score:         { type: number }
        last_active_date:       { type: string }

    DailyActivity:
      type: object
      required: [id, user_id, date, tasks_completed, tasks_total]
      properties:
        id:               { type: string }
        user_id:          { type: string }
        date:             { type: string }
        tasks_completed:  { type: integer }
        tasks_total:      { type: integer }
        discipline_delta: { type: number }

    ActivityInput:
      type: object
      required: [user_id, tasks_completed, tasks_total]
      properties:
        user_id:          { type: string }
        tasks_completed:  { type: integer }
        tasks_total:      { type: integer }
        discipline_delta: { type: number }

    Profile:
      type: object
      required: [user_id, created_at, updated_at]
      properties:
        user_id:     { type: string }
        full_name:   { type: ["string", "null"] }
        email:       { type: ["string", "null"] }
        avatar_url:  { type: ["string", "null"] }
        timezone:    { type: string }
        created_at:  { type: string }
        updated_at:  { type: string }

    ProfileInput:
      type: object
      properties:
        full_name:   { type: string }
        email:       { type: string }
        avatar_url:  { type: string }
        timezone:    { type: string }

    Goal:
      type: object
      required: [id, user_id, title, category, status, progress, created_at, updated_at]
      properties:
        id:           { type: string }
        user_id:      { type: string }
        title:        { type: string }
        description:  { type: ["string", "null"] }
        category:     { type: string }
        status:       { type: string }
        progress:     { type: integer }
        target_date:  { type: ["string", "null"] }
        created_at:   { type: string }
        updated_at:   { type: string }

    GoalInput:
      type: object
      required: [user_id, title]
      properties:
        user_id:      { type: string }
        title:        { type: string, minLength: 1 }
        description:  { type: string }
        category:     { type: string, enum: [health, career, finance, learning, fitness, personal, general] }
        target_date:  { type: string }

    GoalUpdate:
      type: object
      properties:
        title:        { type: string, minLength: 1 }
        description:  { type: string }
        category:     { type: string }
        status:       { type: string, enum: [active, completed, paused] }
        progress:     { type: integer, minimum: 0, maximum: 100 }
        target_date:  { type: string }

    DisciplineResult:
      type: object
      required: [discipline_score, level, weekly_change, momentum_score]
      properties:
        discipline_score: { type: number }
        level:            { type: string }
        weekly_change:    { type: number }
        momentum_score:   { type: number }
        current_streak:   { type: integer }
